name: Tests within Conda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      uses: conda-incubator/setup-miniconda@v3
      with:
        channels: conda-forge
        activate-environment: parq
        environment-file: setup/parq.yml
        python-version: 3.11
    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check || {
          echo "Ruff check failed. Please run 'ruff format .' before trying again."
          exit 1
        }
    - name: Test with unittest
      run: |
        python -c '
        import random
        import unittest
        from pathlib import Path

        import torch

        root = Path.cwd() / "tests"
        success = True
        for path in sorted(root.glob("test_*.py")):
            random.seed(0)
            torch.manual_seed(0)
            suite = unittest.defaultTestLoader.discover(str(root), pattern=path.name)
            result = unittest.TextTestRunner(verbosity=2).run(suite)
            success = result.wasSuccessful() and success
        raise SystemExit(not success)
        '
